name: update-schedule

on:
  schedule:
    # каждый день в 02:00 UTC = 05:00 МСК
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe source
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.kstu.ru/ || echo "ERR")
          echo "kstu.ru HTTP=$code"
          echo "### kstu.ru: $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Scrape schedule
        run: python tools/scrape.py --refresh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: update schedule $(date -u +%F)"
            git push
          fi

      - name: Summary
        run: |
          python -c "import json; d=json.load(open('data/index.json',encoding='utf-8')); print('groups:', sum(i['n'] for i in d['institutes']))" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Автообновление расписания: ошибка";
            const body = `Прогон упал: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nСайт продолжает работать на последних данных.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-update",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auto-update"],
              });
            }
